// Tiltem! yay
@Kopernicus:AFTER[TiltEm]:NEEDS[TiltEm]
{
    @Body[Khion]
    {
        @Properties
        {
            %initialRotation = 0
            %poleRA = 275.203
            %poleDec = 65.305
        }
    }
    @Body[Boreas]
    {
        @Orbit
        {
            tiltRelativeToParent = true  // Redundant?
        }
        @Properties
        {
            %tiltRelativeToParent = true
            %tiltx = 0.952547
            %tiltz = -0.543392
            %initialRotation = 150.299528
        }
    }
    @Body[Cairn]
    {
        @Orbit
        {
            tiltRelativeToParent = true // Redundant?
        }
        @Properties
        {
            %tiltRelativeToParent = true
            %poleRA = 127.1952
            %poleDec = 84.567
            %initialRotation = 230.0
        }
    }
}
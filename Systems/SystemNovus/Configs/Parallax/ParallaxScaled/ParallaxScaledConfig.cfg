@ParallaxTerrain:FOR[SystemNovus]:NEEDS[ParallaxContinued]
{
    @Body[Helia]
    {
        ParallaxScaledProperties
        {
            minTerrainAltitude = -3350
            maxTerrainAltitude = 5743.853
            usingStockMesh:NEEDS[Scatterer] = True
            mode = FromTerrain

            Material
            {
                _ColorMap = KSF/Systems/SystemNovus/PluginData/Helia_Color1.dds
                _BumpMap  = KSF/Systems/SystemNovus/PluginData/Helia_Normal.dds
                _HeightMap = KSF/Systems/SystemNovus/PluginData/Helia_Height.dds
                _PlanetBumpScale = 0.4

                // Keyword params
                _OceanSpecularPower = 0.02
                _OceanSpecularIntensity = 0.15
                _AtmosphereThickness = 2.0
                _OceanAltitude = 0

                Keywords
                {
                    name = OCEAN_FROM_COLORMAP
                    name:NEEDS[!Scatterer] = ATMOSPHERE
                }
            }

            TerrainMaterialOverride
            {
                // Cursed

                _DisplacementScale = 0.2
                _SpecularPower = 7
                _SpecularIntensity = 0.25
                
                _SteepPower = 50
                _SteepContrast = 1.5
                _SteepMidpoint = 0.7

                _EnvironmentMapFactor = 0 // Fixed fuckass reflections
                _RefractionIntensity = 0 // Unused?

                _Tiling = 0.001

                _PlanetBumpScale = 0.5
                _BumpScale = 0.4
                
            }
        }
    }

